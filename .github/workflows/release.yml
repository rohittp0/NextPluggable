name: Release

# Every merge to main publishes `nextpluggable` and `@nextpluggable/plugin` to npm.
# The patch number goes up by one each time; to release a minor or major version,
# set it by hand in both packages' package.json in the pull request.
on:
  push:
    branches: [main]
  workflow_dispatch:

# One release at a time. A merge that lands while a release is running waits for it.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # the version commit, the tag and the GitHub release
  id-token: write # npm trusted publishing and provenance

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # The tip of main rather than the commit that started the run: a queued run then
      # sees the version commit of the release before it.
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Skip a commit that is already released
        id: gate
        run: |
          if git tag --points-at HEAD | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "The tip of main is already tagged as a release. Nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v6
        if: steps.gate.outputs.release == 'true'

      # Node 24 brings an npm new enough for trusted publishing (11.5.1 or later).
      - uses: actions/setup-node@v7
        if: steps.gate.outputs.release == 'true'
        with:
          node-version: 24

      - name: Install
        if: steps.gate.outputs.release == 'true'
        run: pnpm install --frozen-lockfile

      - name: Choose the version
        id: version
        if: steps.gate.outputs.release == 'true'
        run: node scripts/release-version.mjs

      - name: Check that a first release can sign in to npm
        if: steps.gate.outputs.release == 'true' && steps.version.outputs.first_publish == 'true'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::These packages are not on npm yet, and a package's first release cannot use trusted publishing. Add an npm access token that may publish as the repository secret NPM_TOKEN, then run this workflow again."
            exit 1
          fi

      - name: Build and test
        if: steps.gate.outputs.release == 'true'
        run: |
          pnpm build
          pnpm typecheck
          pnpm test

      - name: Pack
        if: steps.gate.outputs.release == 'true'
        run: |
          # Each package's page on npm shows the README inside its tarball. Links into the
          # repository are made absolute, because npm resolves them from the package folder.
          repo="https://github.com/$GITHUB_REPOSITORY"
          links="s#](docs/#]($repo/blob/main/docs/#g; s#](plugins/#]($repo/tree/main/plugins/#g"
          sed "$links" README.md > packages/nextpluggable/README.md
          sed "$links" docs/writing-plugins.md > packages/plugin/README.md
          mkdir -p "$RUNNER_TEMP/release"
          # pnpm turns the `workspace:*` dependency into the real version.
          for dir in packages/plugin packages/nextpluggable; do
            (cd "$dir" && pnpm pack --pack-destination "$RUNNER_TEMP/release")
          done
          ls -l "$RUNNER_TEMP/release"

      # npm signs in through trusted publishing where it is set up for a package, and
      # otherwise with the token.
      - name: Publish to npm
        if: steps.gate.outputs.release == 'true'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo '//registry.npmjs.org/:_authToken=${NPM_TOKEN}' > "$RUNNER_TEMP/npmrc"
            export NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/npmrc"
          fi
          # The SDK first: `nextpluggable` depends on this exact version of it.
          for name in nextpluggable-plugin nextpluggable; do
            npm publish "$RUNNER_TEMP/release/$name-$VERSION.tgz" --access public --provenance
          done

      - name: Record the version on main
        if: steps.gate.outputs.release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CHANGED: ${{ steps.version.outputs.changed }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$CHANGED" = "true" ]; then
            git add packages/plugin/package.json packages/nextpluggable/package.json
            git commit -m "Release v$VERSION"
          fi
          # The tag marks exactly what was published, even if main has moved on since.
          git tag "v$VERSION"
          git push origin "v$VERSION"
          if [ "$CHANGED" = "true" ]; then
            # If main moved on while this ran, put the version commit on top of it.
            git push origin HEAD:main || { git pull --rebase --autostash origin main && git push origin HEAD:main; }
          fi

      - name: Create the GitHub release
        if: steps.gate.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "v$VERSION" --title "v$VERSION" --generate-notes --verify-tag
